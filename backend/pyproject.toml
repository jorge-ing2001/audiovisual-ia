[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiovisual-ia-backend"
version = "0.1.0"
description = "Backend FastAPI de audiovisual-ia (Fase 1 / MVP 2D prompt-to-video)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pillow>=10.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Tier de voz/audio (motor 5). numpy/soundfile bastan para la mezcla y los tests del
# AudioMixer/subtítulos; kokoro-onnx/edge-tts/faster-whisper habilitan la síntesis y los
# subtítulos reales (se descargan modelos en el primer uso). El código TTS MIT vive en
# lemo-opuscar (AIV_LEMO_OPUSCAR_PATH), que aporta sus propias dependencias al invocarse.
voice = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "kokoro-onnx>=0.3",
    "soxr>=0.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
